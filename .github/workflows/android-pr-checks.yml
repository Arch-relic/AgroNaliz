name: Android PR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Configure CI-only AAPT2
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK and run JVM tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Validate document catalog tests
        run: python3 -m unittest discover -s docs -p 'test_validate_document_catalog.py' -v
      - name: Name debug APK artifact
        id: apk
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          branch = re.sub(r"[^A-Za-z0-9_.-]", "-", os.environ["SOURCE_BRANCH"])
          sha = subprocess.check_output(["git", "rev-parse", "--short=12", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name=app-debug-{branch}-{sha}\n")
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr6-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/outputs/apk/debug/output-metadata.json
