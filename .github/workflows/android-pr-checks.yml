name: Android PR checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Configure CI-only AAPT2
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Choose TEST-only preview versionCode
        run: echo "TEST_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build debug APK and run JVM tests
        run: |
          ./gradlew -PtestVersionCode="$TEST_VERSION_CODE" :app:assembleDebug :app:assembleDebugTest :app:testDebugUnitTest :app:testDebugTestUnitTest :app:assembleDebugAndroidTest --no-daemon --stacktrace --console=plain
          ./gradlew -PtestVersionCode="$TEST_VERSION_CODE" -PtestBuildType=debugTest :app:assembleDebugTestAndroidTest --no-daemon --stacktrace --console=plain
      - name: Validate document catalog tests
        run: python3 -m unittest discover -s docs -p 'test_validate_document_catalog.py' -v
      - name: Verify app version and monotonic release policy
        run: python3 -m unittest discover -s docs -p 'test_app_version.py' -v
      - name: Verify APK identifiers and provider isolation
        run: python3 docs/verify-build-variants.py
      - name: Test TEST signer and read-only backup tools without production secrets
        run: python3 -m unittest discover -s docs -p 'test_test_*.py' -v
      - name: Prepare second TEST version for real update test
        run: |
          mkdir -p "$RUNNER_TEMP/test-update-input"
          cp app/build/outputs/apk/debugTest/app-debugTest.apk "$RUNNER_TEMP/test-update-input/first.apk"
          ./gradlew -PtestVersionCode="$((TEST_VERSION_CODE + 1))" :app:assembleDebugTest --no-daemon --stacktrace --console=plain
          cp app/build/outputs/apk/debugTest/app-debugTest.apk "$RUNNER_TEMP/test-update-input/second.apk"
      - name: Checkout real Room v20 migration baseline
        uses: actions/checkout@v4
        with:
          ref: c0ea3d01a97dd0eb4814b59307b44169916821bc
          path: .migration-v20
      - name: Build baseline TEST APK for real database upgrade
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' .migration-v20/gradle.properties
          chmod +x .migration-v20/gradlew
          .migration-v20/gradlew -p .migration-v20 :app:assembleDebugTest --no-daemon --stacktrace --console=plain
      - name: Checkout Room21 moisture/fuel migration baseline
        uses: actions/checkout@v4
        with:
          ref: 68cef94fcf1db9939154d9ad7289ac424ca7089f
          path: .migration-v21
      - name: Build baseline Room21 TEST APK
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' .migration-v21/gradle.properties
          chmod +x .migration-v21/gradlew
          .migration-v21/gradlew -p .migration-v21 :app:assembleDebugTest --no-daemon --stacktrace --console=plain
      - name: Enable emulator KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify data isolation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 docs/run-build-isolation-checks.py
            python3 docs/run-harvest-checks.py
            python3 docs/run-fuel-checks.py
            python3 docs/run-test-signing-checks.py
      - name: Name debug APK artifact
        id: apk
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          branch = re.sub(r"[^A-Za-z0-9_.-]", "-", os.environ["SOURCE_BRANCH"])
          sha = subprocess.check_output(["git", "rev-parse", "--short=12", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"name=app-debug-{branch}-{sha}\n")
              output.write(f"test_name=app-TEST-{branch}-{sha}\n")
          PY
      - name: Upload debug APK
        # PR validation must not publish the main application APK.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # Ephemeral debug-signed TEST APKs are CI fixtures, never installable release artifacts.
      - name: Upload test reports and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr6-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/outputs/apk/debug/output-metadata.json
