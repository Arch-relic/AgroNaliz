name: MAIN 1.0.9 to1.0.10 Room24 same-schema audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room24-same-update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK without production secrets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          chmod +x gradlew
      - name: Build candidate MAIN1.0.10 TEST fixtures and instrumentation
        run: |
          ./gradlew -PmainVersionCode=3000008 -PtestVersionCode=1000302 :app:assembleDebug :app:assembleDebugTest :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:testDebugTestUnitTest --no-daemon --console=plain
          ./gradlew -PmainVersionCode=3000008 -PtestVersionCode=1000302 -PtestBuildType=debugTest :app:assembleDebugTestAndroidTest --no-daemon --console=plain
      - uses: actions/checkout@v4
        with:
          ref: 6da84bf09cf0cd3e9d1b5a40887a134bf25d7fe4
          path: .main109
      - name: Build pinned published MAIN1.0.9 Room24 fixtures
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' .main109/gradle.properties
          chmod +x .main109/gradlew
          .main109/gradlew -p .main109 -PmainVersionCode=3000007 -PtestVersionCode=1000301 :app:assembleDebug :app:assembleDebugTest --no-daemon --console=plain
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Room24 to24 schema data restore and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 docs/run-main-room24-same-checks.py
      - name: Upload diagnostics only no APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-room24-same-diagnostics
          path: |
            app/build/test-results/
            app/build/reports/tests/
            main-room24-same-verification.json
          if-no-files-found: warn
