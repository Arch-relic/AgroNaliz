name: Installed diagnostics and harvest typography
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK without production secrets
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          chmod +x gradlew
      - name: Build disposable MAIN TEST fixtures
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugTest :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:testDebugTestUnitTest --no-daemon --console=plain
          ./gradlew -PtestBuildType=debugTest :app:assembleDebugTestAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Check actual installed metadata and unbroken numbers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 docs/run-ui-polish-checks.py
      - name: Upload test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-polish-api-${{ matrix.api }}-reports
          path: app/build/test-results/
          retention-days: 7
