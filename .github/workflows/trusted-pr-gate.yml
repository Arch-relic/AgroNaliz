name: Trusted PR gate
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  trusted-pr-gate:
    name: trusted-pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
          sparse-checkout: .github/trusted_pr_gate
          sparse-checkout-cone-mode: false
          submodules: false
          lfs: false
      - name: Verify current PR against base policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B trusted-base/.github/trusted_pr_gate/gate.py
