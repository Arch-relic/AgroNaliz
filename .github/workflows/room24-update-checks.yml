name: Room24 synthetic MAIN TEST update audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room24-update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK without production secrets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties
          chmod +x gradlew
      - name: Build disposable future MAIN TEST fixtures and instrumentation
        run: |
          ./gradlew -PmainVersionCode=3000005 -PtestVersionCode=1000202 :app:assembleDebug :app:assembleDebugTest :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:testDebugTestUnitTest --no-daemon --console=plain
          ./gradlew -PmainVersionCode=3000005 -PtestVersionCode=1000202 -PtestBuildType=debugTest :app:assembleDebugTestAndroidTest --no-daemon --console=plain
      - uses: actions/checkout@v4
        with:
          ref: 861024e7852c16adbd733eca84e4ef11f53a32be
          path: .room23
      - name: Build pinned Room23 fixtures without keys or publication
        run: |
          sed -i '/^android\.aapt2FromMavenOverride=/d' .room23/gradle.properties
          chmod +x .room23/gradlew
          .room23/gradlew -p .room23 -PmainVersionCode=3000004 -PtestVersionCode=1000201 :app:assembleDebug :app:assembleDebugTest --no-daemon --console=plain
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify Room23 to24 both packages retain data and restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 docs/run-room24-update-checks.py
      - name: Upload diagnostics only no APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room24-update-diagnostics
          path: |
            app/build/test-results/
            app/build/reports/tests/
            room24-update-verification.json
          if-no-files-found: warn
